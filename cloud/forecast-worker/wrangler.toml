name = "boat-ai-forecast"
main = "src/worker.mjs"
compatibility_date = "2026-10-30"

# Cron reads D1 each minute. The program source is contacted only for daily
# schedule import and a due pre-close observation, never on every cron tick.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "boat-ai-forecast"
# Set database_id from `npx wrangler d1 create boat-ai-forecast` before deploy.
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
PROGRAM_FEED_BASE_URL = "https://boatraceopenapi.github.io/api/v1"
