name: BOAT AI note sales
on:
  workflow_dispatch:
  schedule:
    # JST 10:00-20:30 every 30 minutes. Disabled until NOTE_SALES_ENABLED=true.
    - cron: '0,30 1-11 * * *'
permissions:
  contents: write
concurrency:
  group: boat-ai-note-sales
  cancel-in-progress: false
jobs:
  sales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check opt-in switches
        id: enabled
        env:
          SALES: ${{ vars.NOTE_SALES_ENABLED }}
          PUBLISH: ${{ vars.NOTE_AUTO_PUBLISH_ENABLED }}
        run: |
          echo "sales=$SALES" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Run sales unit tests
        if: steps.enabled.outputs.sales == 'true'
        run: |
          python -m compileall -q note-sales
          python -m unittest discover -s note-sales -p 'test_*.py' -v
      - name: Check duplicate publication ledger
        if: steps.enabled.outputs.sales == 'true'
        id: ledger
        shell: bash
        run: |
          set -euo pipefail
          d="$(TZ=Asia/Tokyo date +%F)"
          echo "today=$d" >> "$GITHUB_OUTPUT"
          git fetch origin main --quiet
          if git cat-file -e "origin/main:note-sales/published/$d.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate article privately
        if: steps.enabled.outputs.sales == 'true' && steps.ledger.outputs.exists == 'false'
        id: article
        env:
          BOAT_AI_FORECAST_URL: ${{ vars.BOAT_AI_FORECAST_URL }}
        run: python note-sales/pipeline.py --date "${{ steps.ledger.outputs.today }}" --output "${{ runner.temp }}/note-article.json"
      - name: Preflight note publishing configuration
        if: steps.article.outputs.eligible == 'true' && steps.enabled.outputs.publish == 'true'
        env:
          NOTE_SESSION_STATE_B64: ${{ secrets.NOTE_SESSION_STATE_B64 }}
          NOTE_BROWSER_UI_VERIFIED: ${{ vars.NOTE_BROWSER_UI_VERIFIED }}
        run: |
          if [[ "$NOTE_BROWSER_UI_VERIFIED" != true || -z "$NOTE_SESSION_STATE_B64" ]]; then
            echo 'NOT_READY: set up the authenticated note editor and confirm its paid UI before publishing.' >&2
            exit 1
          fi
      - name: Claim date before posting (fail-closed anti-duplicate)
        if: steps.article.outputs.eligible == 'true' && steps.enabled.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d="${{ steps.ledger.outputs.today }}"
          git fetch origin main --quiet
          if git cat-file -e "origin/main:note-sales/published/$d.json" 2>/dev/null; then
            echo "DATE_ALREADY_CLAIMED" >&2
            exit 1
          fi
          python note-sales/ledger.py claim "${{ runner.temp }}/note-article.json" "note-sales/published/$d.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "note-sales/published/$d.json"
          git commit -m "Claim BOAT AI note sales date $d [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Install browser
        if: steps.article.outputs.eligible == 'true' && steps.enabled.outputs.publish == 'true'
        run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Publish and verify anonymous paywall
        if: steps.article.outputs.eligible == 'true' && steps.enabled.outputs.publish == 'true'
        env:
          NOTE_SESSION_STATE_B64: ${{ secrets.NOTE_SESSION_STATE_B64 }}
          NOTE_AUTO_PUBLISH_ENABLED: 'true'
          NOTE_BROWSER_UI_VERIFIED: ${{ vars.NOTE_BROWSER_UI_VERIFIED }}
          NOTE_PUBLISH_RESULT_FILE: ${{ runner.temp }}/note-sales-result.json
        run: python note-sales/note_browser.py "${{ runner.temp }}/note-article.json"
      - name: Mark publication verified; otherwise preserve pending claim
        if: steps.article.outputs.eligible == 'true' && steps.enabled.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d="${{ steps.ledger.outputs.today }}"
          git fetch origin main --quiet
          git pull --rebase origin main
          git show "origin/main:note-sales/published/$d.json" > "${{ runner.temp }}/claim.json"
          python note-sales/ledger.py complete "${{ runner.temp }}/claim.json" "note-sales/published/$d.json" --result "${{ runner.temp }}/note-sales-result.json"
          git add "note-sales/published/$d.json"
          git commit -m "Record verified note sales publication $d [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
