name: BOAT AI note sales (opt-in)

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes from 10:00 to 20:30 Japan time. Off by default.
    - cron: '0,30 1-11 * * *'

permissions:
  contents: write

concurrency:
  group: boat-ai-note-sales
  cancel-in-progress: false

jobs:
  sales:
    if: vars.NOTE_SALES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOAT_AI_FORECAST_URL: ${{ vars.BOAT_AI_FORECAST_URL }}
      NOTE_SESSION_STATE_B64: ${{ secrets.NOTE_SESSION_STATE_B64 }}
      NOTE_AUTO_PUBLISH_ENABLED: ${{ vars.NOTE_AUTO_PUBLISH_ENABLED }}
      NOTE_BROWSER_UI_VERIFIED: ${{ vars.NOTE_BROWSER_UI_VERIFIED }}
      NOTE_PUBLISH_RESULT_FILE: ${{ runner.temp }}/note-sales-published.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated sales tests
        run: python -m unittest discover -s note-sales -p 'test_*.py' -v
      - name: Check duplicate public metadata
        id: ledger
        shell: bash
        run: |
          set -euo pipefail
          d="$(TZ=Asia/Tokyo date +%F)"
          echo "today=$d" >> "$GITHUB_OUTPUT"
          git fetch origin main --quiet
          if git cat-file -e "origin/main:note-sales/published/$d.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate private article
        if: steps.ledger.outputs.exists == 'false'
        id: article
        run: python note-sales/pipeline.py --date "${{ steps.ledger.outputs.today }}" --output "${{ runner.temp }}/note-article.json"
      - name: Install headless browser
        if: steps.article.outputs.eligible == 'true' && env.NOTE_AUTO_PUBLISH_ENABLED == 'true'
        run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Publish via authenticated note editor
        if: steps.article.outputs.eligible == 'true' && env.NOTE_AUTO_PUBLISH_ENABLED == 'true'
        run: python note-sales/note_browser.py "${{ runner.temp }}/note-article.json"
      - name: Commit only publication metadata, never paid picks
        if: steps.article.outputs.eligible == 'true' && env.NOTE_AUTO_PUBLISH_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$NOTE_PUBLISH_RESULT_FILE"
          d="${{ steps.ledger.outputs.today }}"
          mkdir -p note-sales/published
          cp "$NOTE_PUBLISH_RESULT_FILE" "note-sales/published/$d.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "note-sales/published/$d.json"
          git commit -m "Record note sales publication $d [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
