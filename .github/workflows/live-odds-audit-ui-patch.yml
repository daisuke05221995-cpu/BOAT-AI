name: Apply live odds audit result UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-odds-audit-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI patch
        run: python3 scripts/live_odds_audit_ui_patch.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Verify UI patch
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit UI and remove patch helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/boatai/app/MainActivity.kt app/src/main/java/jp/boatai/app/CompactDashboardScreens.kt
          git rm -f .github/workflows/live-odds-audit-ui-patch.yml scripts/live_odds_audit_ui_patch.py scripts/live_odds_audit_patch.py scripts/live_odds_audit_patch_v2.py
          git diff --cached --check
          git commit -m "Show live odds audit details and cleanup patch helpers"
          git push origin HEAD:main
