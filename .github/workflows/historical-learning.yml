name: Build five-year historical learning

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/backfill_historical.py'
      - '.github/workflows/historical-learning.yml'

permissions:
  contents: write

concurrency:
  group: historical-learning
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LZH tools and parser
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python -m pip install --upgrade pip
          pip install 'boatrace-lzh==0.1.0'

      - name: Build five-year learning baseline
        run: |
          python scripts/backfill_historical.py \
            --start 2021-09-22 \
            --end 2026-09-21 \
            --workers 4 \
            --request-delay 0.25 \
            --output app/src/main/assets/historical_learning.json

      - name: Validate baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/main/assets/historical_learning.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['trainedFrom'] == '2021-09-22'
          assert data['trainedThrough'] == '2026-09-21'
          assert data['historicalRaceCount'] >= 150000
          assert len(data['starts']) >= 120
          assert len(data['wins']) >= 120
          assert len(data['windCourseStarts']) >= 200
          assert len(data['windCourseWins']) >= 200
          print(json.dumps({
              'historicalRaceCount': data['historicalRaceCount'],
              'downloadedDays': data['downloadedDays'],
              'missingOrNoRaceDays': data['missingOrNoRaceDays'],
              'venueBuckets': len(data['starts']),
              'windCourseBuckets': len(data['windCourseStarts']),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/historical_learning.json
          if git diff --cached --quiet; then
            echo 'Historical baseline is unchanged.'
          else
            git commit -m 'Update five-year historical learning baseline'
            git push
          fi
