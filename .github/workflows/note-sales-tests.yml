name: Test note sales pipeline
on:
  push:
    branches: [main]
    paths:
      - 'note-sales/**'
      - '.github/workflows/note-sales-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q note-sales
      - name: Unit tests
        run: python -m unittest discover -s note-sales -p 'test_*.py' -v
