name: v016 CORE full calendar 2024 validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/v016_annual2024.py
      - scripts/v016_annual2024_test.py
      - scripts/v016_kfile_records.py
      - .github/workflows/v016-annual2024.yml
permissions:
  actions: read
  contents: read
concurrency:
  group: v016-annual2024
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          pip install numpy==2.3.5 boatrace-lzh==0.1.0
      - run: python scripts/v016_annual2024_test.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35833959070
          name: preview-rich-signal-cache-2024
          path: cache
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35833959070
          name: preview-rich-signal-cache-2023
          path: prior
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35868298662
          name: v016-core-calibration
          path: model
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35814229078
          pattern: learning-part-*
          merge-multiple: true
          path: learning-parts
      - name: Reuse verified pre-2024 learning only
        run: |
          mkdir -p selected-learning
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          for p in Path('learning-parts').glob('historical_learning_*.json'):
              d=json.loads(p.read_text())
              if str(d['trainedThrough'])<='2023-12-31':shutil.copy2(p,Path('selected-learning')/p.name)
          PY
          python scripts/merge_validation_learning.py --input-dir selected-learning \
            --start 2021-09-22 --end 2023-12-31 --output learning_2024.json
      - name: Extend only 2024; hard-fail every 2025 annual request
        run: |
          python -u scripts/v016_annual2024.py build \
            --cache cache/rich-cache/signal_cache_2024.npz \
            --prior prior/rich-cache/signal_cache_2023.npz \
            --learning learning_2024.json --model model/v016_core_calibration.json \
            --output annual/annual_2024.npz
      - uses: actions/upload-artifact@v4
        with:
          name: v016-annual-cache-2024
          path: annual/
          retention-days: 90

  screen:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [power, blend, calibration]
        cap: [20, 40]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          name: v016-annual-cache-2024
          path: annual
      - run: |
          python scripts/v016_annual2024.py screen --cache annual/annual_2024.npz \
            --family ${{ matrix.family }} --cap ${{ matrix.cap }} \
            --output results/annual-2024-${{ matrix.family }}-${{ matrix.cap }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v016-annual-screen-${{ matrix.family }}-${{ matrix.cap }}
          path: results/
          retention-days: 90

  aggregate:
    needs: screen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          pattern: v016-annual-screen-*
          merge-multiple: true
          path: results
      - uses: actions/download-artifact@v4
        with:
          name: v016-annual-cache-2024
          path: annual
      - run: |
          python scripts/v016_annual2024.py aggregate --input results \
            --metadata annual/annual_2024.json --run '${{ github.run_id }}' \
            --output data/v016_annual2024_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v016-annual2024-result
          path: data/v016_annual2024_result.json
          retention-days: 90
      - name: Commit research-only annual result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v016_annual2024_result.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record v016 CORE calendar-year 2024 result'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
