name: Money-first profit UI patch

on:
  push:
    paths:
      - 'scripts/patch_money_first_profit_ui.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply money-first UI patch
        run: python scripts/patch_money_first_profit_ui.py

      - name: Validate tests lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit validated UI patch
        run: |
          if git diff --quiet; then
            echo 'No UI changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/boatai/app/CompactDashboardScreens.kt
          git commit -m 'Make cumulative money the center of Profit UI'
          git push
