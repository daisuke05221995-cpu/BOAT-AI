name: Recover partial v0.3 source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-partial.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild partial archive
        shell: bash
        run: |
          cat source-v0.3.0/part00.b64 source-v0.3.0/part01.b64 source-v0.3.0/part02.b64 > partial.b64
          python3 - <<'PY'
          import base64, pathlib
          s=''.join(pathlib.Path('partial.b64').read_text().split())
          s += '=' * ((4-len(s)%4)%4)
          pathlib.Path('partial.zip').write_bytes(base64.b64decode(s, validate=False))
          print('decoded bytes', pathlib.Path('partial.zip').stat().st_size)
          PY

      - name: Recover complete local ZIP entries
        shell: bash
        run: |
          rm -rf recovered-v0.3.0
          python3 - <<'PY'
          import pathlib, struct, zlib

          data = pathlib.Path('partial.zip').read_bytes()
          out_root = pathlib.Path('recovered-v0.3.0')
          out_root.mkdir(parents=True, exist_ok=True)
          pos = 0
          recovered = 0

          while True:
              start = data.find(b'PK\x03\x04', pos)
              if start < 0 or start + 30 > len(data):
                  break
              try:
                  sig, ver, flags, method, mtime, mdate, crc, csize, usize, nlen, xlen = struct.unpack_from('<IHHHHHIIIHH', data, start)
              except struct.error:
                  break
              name_start = start + 30
              name_end = name_start + nlen
              data_start = name_end + xlen
              if data_start > len(data):
                  break
              name = data[name_start:name_end].decode('utf-8', errors='replace')
              if method != 8:
                  print('STOP unsupported compression', method, name)
                  break

              dec = zlib.decompressobj(-15)
              try:
                  raw = dec.decompress(data[data_start:])
                  raw += dec.flush()
              except zlib.error as e:
                  print('STOP zlib error', name, e)
                  break
              if not dec.eof:
                  print('TRUNCATED', name)
                  break

              consumed = len(data[data_start:]) - len(dec.unused_data)
              after_data = data_start + consumed
              if data[after_data:after_data+4] == b'PK\x07\x08':
                  next_pos = after_data + 16
              else:
                  next_pos = after_data + 12

              rel = pathlib.PurePosixPath(name)
              if rel.is_absolute() or '..' in rel.parts:
                  print('SKIP unsafe path', name)
                  pos = next_pos
                  continue
              target = out_root.joinpath(*rel.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              recovered += 1
              print(f'RECOVERED {name} {len(raw)} bytes')
              pos = next_pos

          print('recovered count', recovered)
          if recovered == 0:
              raise SystemExit(1)
          PY
          find recovered-v0.3.0 -type f -print | sort

      - name: Commit recovered files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-v0.3.0
          git commit -m 'Recover files from uploaded BOAT AI v0.3 source parts' || exit 0
          git push
