name: Recover partial v0.3 source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-partial.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild partial archive
        shell: bash
        run: |
          cat source-v0.3.0/part00.b64 source-v0.3.0/part01.b64 source-v0.3.0/part02.b64 > partial.b64
          python3 - <<'PY'
          import base64, pathlib
          s=''.join(pathlib.Path('partial.b64').read_text().split())
          s += '=' * ((4-len(s)%4)%4)
          pathlib.Path('partial.zip').write_bytes(base64.b64decode(s, validate=False))
          print('decoded bytes', pathlib.Path('partial.zip').stat().st_size)
          PY

      - name: Repair partial ZIP
        shell: bash
        run: |
          rm -rf recovered-v0.3.0 repaired.zip
          mkdir -p recovered-v0.3.0
          (yes y | zip -FF partial.zip --out repaired.zip) || true
          test -f repaired.zip

      - name: Recover known complete entries
        shell: bash
        run: |
          files=(
            '.github/workflows/build-apk.yml'
            '.github/workflows/release.yml'
            'README.md'
            'app/build.gradle.kts'
            'app/proguard-rules.pro'
            'app/src/androidTest/java/jp/boatai/app/MainActivitySmokeTest.kt'
            'app/src/main/AndroidManifest.xml'
            'app/src/main/java/jp/boatai/app/AppUpdateManager.kt'
            'app/src/main/java/jp/boatai/app/BetGateway.kt'
            'app/src/main/java/jp/boatai/app/BetStore.kt'
            'app/src/main/java/jp/boatai/app/BoatRaceJsonParser.kt'
            'app/src/main/java/jp/boatai/app/BoatRaceRepository.kt'
            'app/src/main/java/jp/boatai/app/MainActivity.kt'
            'app/src/main/java/jp/boatai/app/BoatViewModel.kt'
            'app/src/main/java/jp/boatai/app/Models.kt'
            'app/src/main/java/jp/boatai/app/PredictionEngine.kt'
            'app/src/main/java/jp/boatai/app/TrifectaOddsLocator.kt'
            'app/src/main/res/values/themes.xml'
            'app/src/main/res/xml/file_paths.xml'
          )
          for f in "${files[@]}"; do
            mkdir -p "recovered-v0.3.0/$(dirname "$f")"
            unzip -p repaired.zip "$f" > "recovered-v0.3.0/$f" || true
            if [ ! -s "recovered-v0.3.0/$f" ]; then
              echo "FAILED: $f"
              rm -f "recovered-v0.3.0/$f"
            else
              echo "RECOVERED: $f ($(wc -c < "recovered-v0.3.0/$f") bytes)"
            fi
          done
          find recovered-v0.3.0 -type f -print | sort

      - name: Commit recovered files
        shell: bash
        run: |
          if [ -z "$(find recovered-v0.3.0 -type f -print -quit)" ]; then
            echo 'No files recovered'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-v0.3.0
          git commit -m 'Recover files from uploaded BOAT AI v0.3 source parts' || exit 0
          git push
