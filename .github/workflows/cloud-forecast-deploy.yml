name: Deploy Cloud forecast

# Only trusted main-branch changes can deploy. PRs cannot read Cloudflare
# secrets or publish to the account. Manual dispatch is still available.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloud/forecast-worker/**'
      - '.github/workflows/cloud-forecast-deploy.yml'

permissions:
  contents: read

concurrency:
  group: boat-ai-cloud-forecast-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cloud forecast contracts
        working-directory: cloud/forecast-worker
        run: npm test
      - name: Configure D1 binding from encrypted GitHub secret
        env:
          BOAT_AI_D1_DATABASE_ID: ${{ secrets.BOAT_AI_D1_DATABASE_ID }}
        run: |
          if [[ ! "$BOAT_AI_D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo 'Required GitHub secret BOAT_AI_D1_DATABASE_ID is missing or malformed.' >&2
            exit 1
          fi
          sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/${BOAT_AI_D1_DATABASE_ID}/" cloud/forecast-worker/wrangler.toml
      - name: Apply remote database migration
        working-directory: cloud/forecast-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 migrations apply boat-ai-forecast --remote
      - name: Ensure workers.dev account subdomain exists
        id: workers_subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo 'Cloudflare account ID is missing or malformed.' >&2
            exit 1
          fi
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint")"
          existing=""
          if [[ "$status" == 200 ]]; then
            if [[ "$(jq -r '.success // false' "$response_file")" != true ]]; then
              echo 'Cloudflare returned an unsuccessful workers.dev lookup.' >&2
              exit 1
            fi
            existing="$(jq -r '.result.subdomain // empty' "$response_file")"
          elif [[ "$status" != 404 ]]; then
            echo "workers.dev lookup failed (HTTP $status)." >&2
            exit 1
          fi
          if [[ -n "$existing" ]]; then
            echo "Existing workers.dev subdomain: ${existing}.workers.dev"
            echo "subdomain=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never overwrite an account's chosen subdomain. Only register when
          # absent, with a deterministic, account-specific and non-PII name.
          proposal="boat-ai-${CLOUDFLARE_ACCOUNT_ID:0:10}"
          proposal="${proposal,,}"
          echo 'Account has no workers.dev subdomain; registering a new one.'
          curl --silent --show-error --fail-with-body --request PUT "$endpoint" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg subdomain "$proposal" '{subdomain:$subdomain}')" \
            --output "$response_file"
          if [[ "$(jq -r '.success // false' "$response_file")" != true ]]; then
            echo 'Cloudflare did not confirm workers.dev registration.' >&2
            exit 1
          fi
          echo "Registered ${proposal}.workers.dev"
          echo "subdomain=$proposal" >> "$GITHUB_OUTPUT"
      - name: Publish Worker and enable deadline cron
        working-directory: cloud/forecast-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify published health and daily audit endpoints
        shell: bash
        env:
          WORKERS_SUBDOMAIN: ${{ steps.workers_subdomain.outputs.subdomain }}
        run: |
          set -euo pipefail
          if [[ ! "$WORKERS_SUBDOMAIN" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo 'workers.dev subdomain is missing or malformed.' >&2
            exit 1
          fi
          base="https://boat-ai-forecast.${WORKERS_SUBDOMAIN}.workers.dev"
          date_jst="$(TZ=Asia/Tokyo date +%F)"
          for attempt in {1..8}; do
            if health="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 12 "$base/v1/health")" \
              && jq -e '.ok == true and .schema_version == 1' <<< "$health" >/dev/null; then
              if audit="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 12 "$base/v1/audit?date=$date_jst")" \
                && jq -e --arg date "$date_jst" '.schema_version == 1 and .date == $date and (.scheduled_races | type == "number")' <<< "$audit" >/dev/null; then
                if collector="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 12 "$base/v1/device-collector/status?date=$date_jst")" \
                  && jq -e --arg date "$date_jst" '.schema_version == 1 and .date == $date and .mode == "DEVICE_RECEIPT_ONLY" and .eligible_for_forecast == false' <<< "$collector" >/dev/null; then
                  echo "Worker health, audit and device collector status available at $base"
                  exit 0
                fi
              fi
            fi
            echo "Worker not yet ready for health + audit check (attempt $attempt/8)."
            sleep 4
          done
          echo 'Deployment finished, but the public API health/audit check did not pass.' >&2
          exit 1
