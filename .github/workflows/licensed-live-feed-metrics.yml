name: Licensed live feed trial metrics (offline)

on:
  push:
    branches:
      - research/licensed-live-feeds-20261106
    paths:
      - 'scripts/live_feed_trial_metrics.mjs'
      - 'scripts/live_feed_trial_metrics.test.mjs'
      - '.github/workflows/licensed-live-feed-metrics.yml'
  pull_request:
    paths:
      - 'scripts/live_feed_trial_metrics.mjs'
      - 'scripts/live_feed_trial_metrics.test.mjs'
      - '.github/workflows/licensed-live-feed-metrics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline synthetic trial-metrics regression
        run: node --test scripts/live_feed_trial_metrics.test.mjs
