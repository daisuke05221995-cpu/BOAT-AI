name: Android odds bridge research (offline)
on:
  push:
    branches:
      - research/android-odds-capture-purchase-preflight-20261108
    paths:
      - scripts/android_odds_bridge_preflight.mjs
      - scripts/android_odds_bridge_preflight.test.mjs
      - scripts/android_odds_result_adapter.mjs
      - scripts/android_odds_result_adapter.test.mjs
      - scripts/purchase_control_map_audit.mjs
      - scripts/purchase_control_map_audit.test.mjs
      - scripts/official_control_export_adapter.mjs
      - scripts/official_control_export_adapter.test.mjs
      - scripts/purchase_replay_guard.mjs
      - scripts/purchase_replay_guard.test.mjs
      - scripts/purchase_review_consistency.mjs
      - scripts/purchase_review_consistency.test.mjs
      - scripts/purchase_receipt_consistency.mjs
      - scripts/purchase_receipt_consistency.test.mjs
      - scripts/purchase_dry_run_coordinator.mjs
      - scripts/purchase_dry_run_coordinator.test.mjs
      - scripts/purchase_attempt_journal.mjs
      - scripts/purchase_attempt_journal.test.mjs
      - .github/workflows/android-odds-bridge-research.yml
  pull_request:
    paths:
      - scripts/android_odds_bridge_preflight.mjs
      - scripts/android_odds_bridge_preflight.test.mjs
      - scripts/android_odds_result_adapter.mjs
      - scripts/android_odds_result_adapter.test.mjs
      - scripts/purchase_control_map_audit.mjs
      - scripts/purchase_control_map_audit.test.mjs
      - scripts/official_control_export_adapter.mjs
      - scripts/official_control_export_adapter.test.mjs
      - scripts/purchase_replay_guard.mjs
      - scripts/purchase_replay_guard.test.mjs
      - scripts/purchase_review_consistency.mjs
      - scripts/purchase_review_consistency.test.mjs
      - scripts/purchase_receipt_consistency.mjs
      - scripts/purchase_receipt_consistency.test.mjs
      - scripts/purchase_dry_run_coordinator.mjs
      - scripts/purchase_dry_run_coordinator.test.mjs
      - scripts/purchase_attempt_journal.mjs
      - scripts/purchase_attempt_journal.test.mjs
      - .github/workflows/android-odds-bridge-research.yml
jobs:
  offline-odds-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Audit Android odds quarantine bridge (synthetic only)
        run: node --test scripts/official_control_export_adapter.test.mjs scripts/android_odds_bridge_preflight.test.mjs scripts/android_odds_result_adapter.test.mjs scripts/purchase_control_map_audit.test.mjs scripts/purchase_replay_guard.test.mjs scripts/purchase_review_consistency.test.mjs scripts/purchase_receipt_consistency.test.mjs scripts/purchase_dry_run_coordinator.test.mjs scripts/purchase_attempt_journal.test.mjs
