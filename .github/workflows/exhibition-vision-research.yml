name: Exhibition vision research (shadow-only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/exhibition_vision/**'
      - 'data/EXHIBITION_VISION_RESEARCH_20261029.md'
      - '.github/workflows/exhibition-vision-research.yml'
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - 'scripts/exhibition_vision/**'
      - 'data/EXHIBITION_VISION_RESEARCH_20261029.md'
      - '.github/workflows/exhibition-vision-research.yml'
  # GitHub cron is best-effort (possibly delayed), not a realtime guarantee.
  # A separate licensed video-detector poll remains opt-in below.
  schedule:
    - cron: '2-57/5 23,0-13 * * *'

permissions:
  contents: read

jobs:
  score-contract-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Video evidence and ranking tests
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/exhibition_vision -p 'test_*.py' -v

  public-preview-poll:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch four documented public CSV snapshots (research only)
        run: PYTHONPATH=scripts python3 -m exhibition_vision.public_feed --output-dir "$RUNNER_TEMP/public-preview" --live-only
      - name: Save temporary numeric snapshots, not videos or BUY decisions
        uses: actions/upload-artifact@v4
        with:
          name: public-exhibition-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/public-preview/*.json
          if-no-files-found: ignore
          retention-days: 3

  approved-provider-poll:
    if: github.event_name == 'schedule' && vars.EXHIBITION_AI_FEED_URL != '' && vars.EXHIBITION_AI_ALLOWED_HOSTS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research-only automatic poll of licensed detector measurements
        env:
          EXHIBITION_AI_FEED_URL: ${{ vars.EXHIBITION_AI_FEED_URL }}
          EXHIBITION_AI_ALLOWED_HOSTS: ${{ vars.EXHIBITION_AI_ALLOWED_HOSTS }}
        run: PYTHONPATH=scripts python3 -m exhibition_vision.worker --output-dir "$RUNNER_TEMP/exhibition-ranks"
      - name: Keep derived numeric scores briefly, only when explicitly permitted
        if: vars.EXHIBITION_AI_ALLOW_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-shadow-ranks-${{ github.run_id }}
          path: ${{ runner.temp }}/exhibition-ranks/*.json
          if-no-files-found: ignore
          retention-days: 3
