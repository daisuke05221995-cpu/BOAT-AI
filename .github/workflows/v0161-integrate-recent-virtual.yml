name: Integrate recent Model A virtual history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0161-integrate-recent-virtual.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Android state and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              actual=s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:100]!r}')
              p.write_text(s.replace(old,new,count))

          vm='app/src/main/java/jp/boatai/app/BoatViewModel.kt'
          replace(vm,
          '''    val predictionHistory: List<PredictionRecord> = emptyList(),
              val performance: PredictionPerformanceProfile = PredictionPerformanceProfile(),''',
          '''    val predictionHistory: List<PredictionRecord> = emptyList(),
              val modelARecentVirtualRecords: List<PredictionRecord> = emptyList(),
              val modelARecentVirtualThroughDate: String? = null,
              val modelARecentVirtualError: String? = null,
              val performance: PredictionPerformanceProfile = PredictionPerformanceProfile(),''')

          replace(vm,
          '''    private val predictionStore = PredictionHistoryStore(application)
              private val appUpdateManager = AppUpdateManager(application)''',
          '''    private val predictionStore = PredictionHistoryStore(application)
              private val modelARecentVirtualRepository = ModelARecentVirtualRepository(application)
              private val appUpdateManager = AppUpdateManager(application)''')

          replace(vm,
          '''    private val notificationScheduler = NotificationScheduler(application)
              private val today = LocalDate.now(ZoneId.of("Asia/Tokyo"))
              private var oddsRefreshJob: Job? = null''',
          '''    private val notificationScheduler = NotificationScheduler(application)
              private fun currentToday(): LocalDate = LocalDate.now(ZoneId.of("Asia/Tokyo"))
              private fun earliestBrowsableDate(): LocalDate =
                  currentToday().minusDays(ModelARecentVirtualRepository.WINDOW_DAYS.toLong())
              private var oddsRefreshJob: Job? = null''')

          replace(vm,
          '''        loadDate(_ui.value.date)
              }
          
              fun loadDate(date: LocalDate) {
                  if (date.isAfter(today)) return''',
          '''        loadModelARecentVirtual()
                  loadDate(_ui.value.date)
              }
          
              private fun loadModelARecentVirtual() {
                  viewModelScope.launch {
                      val result = modelARecentVirtualRepository.load()
                      _ui.update {
                          it.copy(
                              modelARecentVirtualRecords = result.records,
                              modelARecentVirtualThroughDate = result.throughDate,
                              modelARecentVirtualError = result.error
                          )
                      }
                  }
              }
          
              fun loadDate(date: LocalDate) {
                  if (date.isAfter(currentToday()) || date.isBefore(earliestBrowsableDate())) return''')

          replace(vm,
          '''    fun previousDay() = loadDate(_ui.value.date.minusDays(1))
              fun nextDay() = loadDate(_ui.value.date.plusDays(1))
              fun refresh() = loadDate(_ui.value.date)''',
          '''    fun previousDay() {
                  val target = _ui.value.date.minusDays(1)
                  if (!target.isBefore(earliestBrowsableDate())) loadDate(target)
              }
              fun nextDay() {
                  val target = _ui.value.date.plusDays(1)
                  if (!target.isAfter(currentToday())) loadDate(target)
              }
              fun refresh() {
                  loadModelARecentVirtual()
                  loadDate(_ui.value.date)
              }''')

          replace(vm,
          '''    fun selectRace(race: RaceData) {
                  val initial = if (PredictionEngine.hasValueStrategyModel()) {''',
          '''    fun selectRace(race: RaceData) {
                  val retrospective = _ui.value.modelARecentVirtualRecords.firstOrNull { it.id == race.id }
                  val initial = if (retrospective != null) {
                      retrospective.combinations.mapIndexed { index, combination ->
                          PredictionPick(
                              combination = combination,
                              score = 0.0,
                              recommendedStake = retrospective.stakes.getOrNull(index) ?: retrospective.stakePerPick,
                              reason = "対象日前日までの履歴だけで再現したModel A予想"
                          )
                      }
                  } else if (PredictionEngine.hasValueStrategyModel()) {''')

          replace(vm,
          '''    private fun loadOdds(race: RaceData, initial: List<PredictionPick>, showLoading: Boolean = true) {
                  if (showLoading) _ui.update { it.copy(oddsLoading = true, oddsError = null) }
                  viewModelScope.launch {
                      val requested = when {''',
          '''    private fun loadOdds(race: RaceData, initial: List<PredictionPick>, showLoading: Boolean = true) {
                  if (showLoading) _ui.update { it.copy(oddsLoading = true, oddsError = null) }
                  viewModelScope.launch {
                      val retrospective = _ui.value.modelARecentVirtualRecords.firstOrNull { it.id == race.id }
                      val requested = when {
                          retrospective != null -> initial.map { it.combination }''')

          replace(vm,
          '''                .onSuccess { result ->
                          val strategyPredictions = PredictionEngine.withOdds(
                              race,
                              initial,
                              result.odds,
                              _ui.value.raceBudget
                          )
                          val decision = PredictionEngine.recommendation(race)''',
          '''                .onSuccess { result ->
                          val strategyPredictions = if (retrospective != null) {
                              initial.map { pick ->
                                  pick.copy(
                                      odds = result.odds[pick.combination],
                                      reason = "過去Model A再現 / レース終了後の公式オッズ"
                                  )
                              }
                          } else {
                              PredictionEngine.withOdds(
                                  race,
                                  initial,
                                  result.odds,
                                  _ui.value.raceBudget
                              )
                          }
                          val decision = PredictionEngine.recommendation(race)''')

          replace(vm,
          '''                    val displayedPredictions = if (
                              PredictionEngine.hasValueStrategyModel() &&
                              decision.recommendation == RaceRecommendation.SKIP
                          ) {''',
          '''                    val displayedPredictions = if (retrospective != null) {
                              strategyPredictions
                          } else if (
                              PredictionEngine.hasValueStrategyModel() &&
                              decision.recommendation == RaceRecommendation.SKIP
                          ) {''')

          replace(vm,
          '''                    val history = predictionStore.captureOpenRaces(listOf(race))
                          val performance = PredictionPerformanceProfile.from(history)
                          PredictionEngine.installPerformanceProfile(performance)''',
          '''                    val history = if (retrospective == null) {
                              predictionStore.captureOpenRaces(listOf(race))
                          } else {
                              _ui.value.predictionHistory
                          }
                          val performance = PredictionPerformanceProfile.from(history)
                          if (retrospective == null) PredictionEngine.installPerformanceProfile(performance)''', count=1)

          replace(vm,
          '''                        oddsDecision = if (PredictionEngine.hasValueStrategyModel() || PredictionEngine.hasAiForecastMode()) {
                                      decision.reason
                                  } else {''',
          '''                        oddsDecision = if (retrospective != null) {
                                      "過去Model A再現。予想は対象日前日までの履歴のみ、表示オッズはレース終了後に取得した公式値"
                                  } else if (PredictionEngine.hasValueStrategyModel() || PredictionEngine.hasAiForecastMode()) {
                                      decision.reason
                                  } else {''')

          dash='app/src/main/java/jp/boatai/app/CompactDashboardScreens.kt'
          replace(dash,
          '''import java.time.format.DateTimeFormatter
          import java.util.Locale''',
          '''import java.time.LocalDate
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import java.util.Locale''')

          replace(dash,
          '''    val predictionByRace = ui.predictionHistory.associateBy { it.id }
              val venues = results.groupBy { it.stadiumNumber }.toSortedMap()''',
          '''    val predictionByRace = ui.predictionHistory.associateBy { it.id } +
                  ui.modelARecentVirtualRecords.associateBy { it.id }
              val venues = results.groupBy { it.stadiumNumber }.toSortedMap()''')

          replace(dash,
          '''                DashboardMetric("事前予想", "$captured R", Modifier.weight(1f))''',
          '''                DashboardMetric("AI予想", "$captured R", Modifier.weight(1f))''')

          replace(dash,
          '''                                        if (purchases.isNotEmpty()) {
                                              Text("実購入 ${compactMoney(stake)} / 払戻 ${compactMoney(payout)} / ${signedCompactMoney(payout - stake)}", style = MaterialTheme.typography.labelSmall)
                                          }''',
          '''                                        if (prediction?.strategyId == ModelARecentVirtualRepository.STRATEGY_ID) {
                                              Text(
                                                  "Model A仮想 ${compactMoney(prediction.simulatedStake)} → ${compactMoney(prediction.simulatedPayout)} / ${signedCompactMoney(prediction.simulatedProfit)}",
                                                  style = MaterialTheme.typography.labelSmall,
                                                  fontWeight = FontWeight.SemiBold
                                              )
                                          }
                                          if (purchases.isNotEmpty()) {
                                              Text("実購入 ${compactMoney(stake)} / 払戻 ${compactMoney(payout)} / ${signedCompactMoney(payout - stake)}", style = MaterialTheme.typography.labelSmall)
                                          }''')

          replace(dash,
          '''    val settledPredictions = ui.predictionHistory.filter { it.settled && it.evaluationEligible }
              val selectedPredictions = when (period) {''',
          '''    val settledPredictions = ui.predictionHistory.filter { it.settled && it.evaluationEligible }
              val retrospectivePredictions = ui.modelARecentVirtualRecords.filter { it.settled && it.evaluationEligible }
              val selectedRetrospective = when (period) {
                  0 -> retrospectivePredictions.filter { it.date == dateText }
                  1 -> retrospectivePredictions.filter { it.date >= weekStart && it.date <= dateText }
                  2 -> retrospectivePredictions.filter { it.date.startsWith(monthPrefix) }
                  else -> retrospectivePredictions
              }
              val selectedPredictions = when (period) {''')

          replace(dash,
          '''    val recommended = ProfitAnalytics.summarize(selectedPredictions.filter { it.recommended })
              val all = ProfitAnalytics.summarize(selectedPredictions)''',
          '''    val recommended = ProfitAnalytics.summarize(selectedPredictions.filter { it.recommended })
              val all = ProfitAnalytics.summarize(selectedPredictions)
              val retrospective = ProfitAnalytics.summarize(selectedRetrospective)''')

          replace(dash,
          '''        item {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      AnalyticsMiniCard("AI購入推奨", recommended, Modifier.weight(1f))''',
          '''        item {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.secondaryContainer)
                  ) {
                      Column(Modifier.padding(14.dp)) {
                          Text("Model A 過去仮想損益（確定払戻）", fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleMedium)
                          Text(signedCompactMoney(retrospective.profit), fontWeight = FontWeight.Bold, style = MaterialTheme.typography.headlineMedium)
                          Text("${retrospective.hits}/${retrospective.races}的中 / 購入 ${compactMoney(retrospective.stake)} / 払戻 ${compactMoney(retrospective.payout)} / 回収率 ${compactPercent(retrospective.roi)}")
                          Text(
                              "対象日前日までの履歴だけでModel A上位4点を先に再現し、1点300円（1R 1,200円）をレース終了後の確定払戻で精算。締切前に同じ価格で買えたことを示すROIではありません。",
                              style = MaterialTheme.typography.bodySmall
                          )
                          ui.modelARecentVirtualThroughDate?.let { Text("更新: $it まで / 表示は直近1か月", style = MaterialTheme.typography.labelSmall) }
                          ui.modelARecentVirtualError?.let { Text(it, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.error) }
                      }
                  }
              }

              item {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      AnalyticsMiniCard("AI購入推奨", recommended, Modifier.weight(1f))''')

          replace(dash,
          '''private fun CompactDateSelector(ui: BoatUiState, vm: BoatViewModel) {
              val formatter = DateTimeFormatter.ofPattern("M月d日(E)", Locale.JAPANESE)
              Card(modifier = Modifier.fillMaxWidth()) {''',
          '''private fun CompactDateSelector(ui: BoatUiState, vm: BoatViewModel) {
              val formatter = DateTimeFormatter.ofPattern("M月d日(E)", Locale.JAPANESE)
              val today = LocalDate.now(ZoneId.of("Asia/Tokyo"))
              val earliest = today.minusDays(ModelARecentVirtualRepository.WINDOW_DAYS.toLong())
              Card(modifier = Modifier.fillMaxWidth()) {''')
          replace(dash,
          '''            TextButton(onClick = vm::previousDay) { Text("‹ 前日") }
                      Text(ui.date.format(formatter), fontWeight = FontWeight.Bold)
                      TextButton(onClick = vm::nextDay) { Text("翌日 ›") }''',
          '''            TextButton(onClick = vm::previousDay, enabled = ui.date.isAfter(earliest)) { Text("‹ 前日") }
                      Text(ui.date.format(formatter), fontWeight = FontWeight.Bold)
                      TextButton(onClick = vm::nextDay, enabled = ui.date.isBefore(today)) { Text("翌日 ›") }''')

          main='app/src/main/java/jp/boatai/app/MainActivity.kt'
          replace(main,
          '''import java.time.format.DateTimeFormatter
          import java.util.Locale''',
          '''import java.time.LocalDate
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import java.util.Locale''')
          replace(main,
          '''private fun DateSelectorCard(ui: BoatUiState, vm: BoatViewModel) {
              val formatter = DateTimeFormatter.ofPattern("yyyy年M月d日(E)", Locale.JAPANESE)
              Card(modifier = Modifier.fillMaxWidth()) {''',
          '''private fun DateSelectorCard(ui: BoatUiState, vm: BoatViewModel) {
              val formatter = DateTimeFormatter.ofPattern("yyyy年M月d日(E)", Locale.JAPANESE)
              val today = LocalDate.now(ZoneId.of("Asia/Tokyo"))
              val earliest = today.minusDays(ModelARecentVirtualRepository.WINDOW_DAYS.toLong())
              Card(modifier = Modifier.fillMaxWidth()) {''')
          replace(main,
          '''            IconButton(onClick = vm::previousDay) { Icon(Icons.Default.ChevronLeft, contentDescription = "前日") }''',
          '''            IconButton(onClick = vm::previousDay, enabled = ui.date.isAfter(earliest)) { Icon(Icons.Default.ChevronLeft, contentDescription = "前日") }''')
          replace(main,
          '''            IconButton(onClick = vm::nextDay) { Icon(Icons.Default.ChevronRight, contentDescription = "翌日") }''',
          '''            IconButton(onClick = vm::nextDay, enabled = ui.date.isBefore(today)) { Icon(Icons.Default.ChevronRight, contentDescription = "翌日") }''')

          replace(main,
          '''private fun RaceDetailScreen(ui: BoatUiState, vm: BoatViewModel) {
              val race = ui.selectedRace ?: return
              val savedPrediction = ui.predictionHistory.firstOrNull { it.id == race.id }
              val decision = savedPrediction?.let {''',
          '''private fun RaceDetailScreen(ui: BoatUiState, vm: BoatViewModel) {
              val race = ui.selectedRace ?: return
              val prospectivePrediction = ui.predictionHistory.firstOrNull { it.id == race.id }
              val retrospectivePrediction = ui.modelARecentVirtualRecords.firstOrNull { it.id == race.id }
              val savedPrediction = retrospectivePrediction ?: prospectivePrediction
              val isRetrospective = savedPrediction?.strategyId == ModelARecentVirtualRepository.STRATEGY_ID
              val decision = savedPrediction?.let {''')

          replace(main,
          '''                            Text("事前予想 ${prediction.combinations.joinToString(" / ").ifBlank { "買い目なし" }}")
                                  Text(
                                      if (prediction.hit) "予想的中　想定払戻 ${money(prediction.simulatedPayout)}" else "予想ハズレ",
                                      fontWeight = FontWeight.SemiBold,
                                      color = if (prediction.hit) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.error
                                  )
                              } ?: Text("このレースは締切前の予想履歴が保存されていません", style = MaterialTheme.typography.bodySmall)''',
          '''                            Text((if (isRetrospective) "過去Model A再現 " else "事前予想 ") + prediction.combinations.joinToString(" / ").ifBlank { "買い目なし" })
                                  Text(
                                      if (prediction.hit) "予想的中　想定払戻 ${money(prediction.simulatedPayout)}" else "予想ハズレ",
                                      fontWeight = FontWeight.SemiBold,
                                      color = if (prediction.hit) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.error
                                  )
                                  if (isRetrospective) {
                                      Text(
                                          "仮想購入 ${money(prediction.simulatedStake)} / 払戻 ${money(prediction.simulatedPayout)} / 損益 ${signedMoney(prediction.simulatedProfit)}",
                                          style = MaterialTheme.typography.bodySmall,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                      Text("予想は対象日前日までの履歴だけで再現。精算は終了後の確定払戻です。", style = MaterialTheme.typography.bodySmall)
                                  }
                              } ?: Text("このレースは保存済み予想がありません", style = MaterialTheme.typography.bodySmall)''')

          replace(main,
          '''                Text("全国/当地・平均ST・モーター/ボート・展示・直前ST・進入を合成", style = MaterialTheme.typography.bodySmall)''',
          '''                Text(
                      if (isRetrospective) "対象日前日までの履歴でModel Aを再現。オッズはレース終了後の公式値" else "全国/当地・平均ST・モーター/ボート・展示・直前ST・進入を合成",
                      style = MaterialTheme.typography.bodySmall
                  )''')
          PY
      - name: Commit Android integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/boatai/app/BoatViewModel.kt app/src/main/java/jp/boatai/app/CompactDashboardScreens.kt app/src/main/java/jp/boatai/app/MainActivity.kt
          git commit -m 'Show rolling Model A virtual results in Android [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
