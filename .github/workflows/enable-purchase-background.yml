name: Enable hardened purchase alerts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enable_purchase_background.py'
      - '.github/workflows/enable-purchase-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/enable_purchase_background.py
      - name: Commit manifest and remove temporary patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/AndroidManifest.xml
          git rm scripts/enable_purchase_background.py .github/workflows/enable-purchase-background.yml
          git commit -m 'Re-enable hardened purchase alert background components'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
