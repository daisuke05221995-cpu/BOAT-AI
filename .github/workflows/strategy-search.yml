name: Search profitable 2026 strategy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/search_2026_strategy.py'
      - 'scripts/search_2026_strategy_v7.py'
      - 'scripts/search_2026_strategy_v8.py'
      - 'scripts/search_2026_strategy_v9.py'
      - 'scripts/search_2026_strategy_v10.py'
      - 'scripts/search_2026_strategy_v11.py'
      - 'scripts/search_2026_strategy_v12.py'
      - '.github/workflows/strategy-search.yml'
      - 'data/historical_learning_pre2026.json'

permissions:
  contents: write

concurrency:
  group: strategy-search-2026-v12
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install search dependencies
        run: pip install 'numpy>=2.0,<3.0'

      - name: Verify leakage-safe learning snapshot
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/historical_learning_pre2026.json', encoding='utf-8'))
          assert data.get('trainedFrom') == '2021-09-22'
          assert data.get('trainedThrough') == '2025-12-31'
          assert data.get('snapshotComplete') is True
          assert int(data.get('historicalRaceCount', 0)) > 200000
          PY

      - name: Run v12 guarded monthly adaptive odds-value walk-forward
        run: |
          python -u scripts/search_2026_strategy_v12.py \
            --start 2026-01-01 \
            --learning data/historical_learning_pre2026.json \
            --workers 16 \
            --output data/strategy_search_2026.json

      - name: Validate strategy search output
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/strategy_search_2026.json', encoding='utf-8'))
          assert int(data.get('schemaVersion', 0)) >= 12
          assert data['periods']['calibration'] == ['2026-02-01','2026-04-30']
          cfg=data['nextLiveConfig']
          assert 1 <= int(cfg['maxPoints']) <= 10
          assert cfg['allocationMode'] in ('equal','probability')
          assert int(cfg['budget']) == 1200
          assert data.get('oddsFinalGateIncluded') is True
          assert data.get('qualifiedForRelease') is False
          assert data.get('releaseDeferredForIndependentValidation') is True
          guard=data.get('guardPolicy', {})
          assert float(guard.get('minVolumeRetention', 0)) >= 0.5
          assert len(data.get('guardDecisions', [])) >= 5
          coverage=data.get('oddsCoverage', {})
          assert int(coverage.get('daysLoaded', 0)) >= 150
          print(json.dumps({
            'operationMonths': data['operationMonths'],
            'operation': data['operation'],
            'positiveOperationMonths': data['positiveOperationMonths'],
            'worstOperationMonthRoi': data['worstOperationMonthRoi'],
            'historicalCriteriaMet': data['historicalCriteriaMet'],
            'qualifiedForRelease': data['qualifiedForRelease'],
            'releaseDeferredForIndependentValidation': data['releaseDeferredForIndependentValidation'],
            'nextLiveConfig': cfg,
            'guardDecisions': data['guardDecisions'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit strategy search result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy_search_2026.json
          if git diff --cached --quiet; then
            echo 'Strategy search result is unchanged.'
          else
            git commit -m 'Refresh 2026 guarded strategy result'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
