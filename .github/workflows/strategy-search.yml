name: Search profitable 2026 strategy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/search_2026_strategy.py'
      - 'scripts/search_2026_strategy_v7.py'
      - '.github/workflows/strategy-search.yml'
      - 'data/historical_learning_pre2026.json'

permissions:
  contents: write

concurrency:
  group: strategy-search-2026
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install search dependencies
        run: pip install 'numpy>=2.0,<3.0'

      - name: Verify leakage-safe learning snapshot
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/historical_learning_pre2026.json', encoding='utf-8'))
          assert data.get('trainedFrom') == '2021-09-22'
          assert data.get('trainedThrough') == '2025-12-31'
          assert data.get('snapshotComplete') is True
          assert int(data.get('historicalRaceCount', 0)) > 200000
          PY

      - name: Search robust race-selectivity strategy
        run: |
          python -u scripts/search_2026_strategy_v7.py \
            --start 2026-01-01 \
            --learning data/historical_learning_pre2026.json \
            --workers 16 \
            --output data/strategy_search_2026.json

      - name: Validate strategy search output
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/strategy_search_2026.json', encoding='utf-8'))
          schema=int(data.get('schemaVersion', 1))
          if schema >= 5:
              assert data['periods']['train'] == ['2026-01-01','2026-04-30']
              assert data['periods']['tune'] == ['2026-05-01','2026-06-30']
              assert data['periods']['validation'] == ['2026-07-01','2026-08-31']
              cfg=data['selected']['config']
              assert 1 <= int(cfg['maxPoints']) <= 10
              assert cfg['allocationMode'] in ('equal','probability')
              assert int(cfg['budget']) == 1200
              print(json.dumps({
                'schemaVersion': schema,
                'config': cfg,
                'tuneMonths': data['selected']['tuneMonths'],
                'validationMonths': data['validationMonths'],
                'validation': data['validation'],
                'qualifiedForFinal': data.get('qualifiedForFinal', False),
                'qualifiedForRelease': data.get('qualifiedForRelease', False),
                'final': data.get('final', {}),
              }, ensure_ascii=False, indent=2))
          elif schema >= 4:
              assert data['periods']['warmup'] == ['2026-01-01','2026-02-28']
              assert data['periods']['development'] == ['2026-03-01','2026-06-30']
              assert data['periods']['validation'] == ['2026-07-01','2026-08-31']
              cfg=data['selected']['config']
              assert 1 <= int(cfg['maxPoints']) <= 10
              assert int(cfg['budget']) == 1200
          elif schema >= 2:
              assert data['periods']['train'] == ['2026-01-01','2026-04-30']
              assert data['periods']['tune'] == ['2026-05-01','2026-06-30']
              assert data['periods']['validation'] == ['2026-07-01','2026-08-31']
          else:
              cfg=data['selected']['config']
              assert 1 <= int(cfg['points']) <= 10
              assert sum(cfg['stakes']) == 1200
          PY

      - name: Commit strategy search result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strategy_search_2026.json
          if git diff --cached --quiet; then
            echo 'Strategy search result is unchanged.'
          else
            git commit -m 'Refresh 2026 strategy search result'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
