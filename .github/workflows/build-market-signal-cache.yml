name: Build archived market signal caches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_market_signal_cache.py'
      - '.github/workflows/build-market-signal-cache.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: boat-ai-market-signal-cache
  cancel-in-progress: true

jobs:
  cache:
    name: cache (${{ matrix.year }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        year: [2023, 2024, 2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          pip install 'numpy>=2.0,<3.0' 'boatrace-lzh==0.1.0'

      - name: Reuse verified official learning artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35814229078
          pattern: learning-part-*
          path: learning-parts
          merge-multiple: true

      - name: Build leakage-safe pre-year snapshot
        env:
          TARGET_YEAR: ${{ matrix.year }}
        run: |
          PREVIOUS_YEAR=$((TARGET_YEAR - 1))
          mkdir -p selected-learning-parts
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          target=int(os.environ['TARGET_YEAR'])
          cutoff=target-1
          selected=[]
          for path in sorted(Path('learning-parts').glob('historical_learning_*.json')):
              data=json.loads(path.read_text(encoding='utf-8'))
              end_year=int(str(data['trainedThrough'])[:4])
              if end_year <= cutoff:
                  dst=Path('selected-learning-parts')/path.name
                  shutil.copy2(path,dst)
                  selected.append(path.name)
          if not selected:
              raise SystemExit('no eligible learning parts')
          print('selected:', selected)
          PY
          python -u scripts/merge_validation_learning.py \
            --input-dir selected-learning-parts \
            --start 2021-09-22 \
            --end "${PREVIOUS_YEAR}-12-31" \
            --output "learning_${TARGET_YEAR}.json"

      - name: Build compressed signal cache
        env:
          TARGET_YEAR: ${{ matrix.year }}
        run: |
          python -u scripts/build_market_signal_cache.py \
            --year "$TARGET_YEAR" \
            --learning "learning_${TARGET_YEAR}.json" \
            --workers 16 \
            --output "signal_cache_${TARGET_YEAR}.npz" \
            --metadata "signal_cache_${TARGET_YEAR}.json"

      - name: Validate cache
        env:
          TARGET_YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import json, os, numpy as np
          year=int(os.environ['TARGET_YEAR'])
          meta=json.load(open(f'signal_cache_{year}.json', encoding='utf-8'))
          arr=np.load(f'signal_cache_{year}.npz')
          assert meta['year'] == year
          assert meta['learningTrainedThrough'] == f'{year-1}-12-31'
          assert meta['comboCount'] == 120
          assert arr['model_p'].shape[1] == 120
          assert arr['market_p'].shape == arr['model_p'].shape
          assert arr['odds'].shape == arr['model_p'].shape
          assert len(arr['month']) == meta['cachedRaces']
          assert float(meta['recordSource']['programMetricCoverage']) >= 90.0
          print(json.dumps({
              'year': year,
              'cachedRaces': meta['cachedRaces'],
              'shape': arr['model_p'].shape,
              'programMetricCoverage': meta['recordSource']['programMetricCoverage'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload cache
        uses: actions/upload-artifact@v4
        with:
          name: market-signal-cache-${{ matrix.year }}
          path: |
            signal_cache_${{ matrix.year }}.npz
            signal_cache_${{ matrix.year }}.json
          retention-days: 30
          compression-level: 0
