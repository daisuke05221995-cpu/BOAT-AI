name: v0.16 CORE r3 Q1 completion

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v016_r3_pre2024.py'
      - 'scripts/v016_r3_q1.py'
      - 'data/v016_r3_protocol.json'
      - '.github/workflows/v016-r3-q1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: v016-r3-q1
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'

jobs:
  q1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          pip install numpy==2.3.5 lightgbm==4.6.0 boatrace-lzh==0.1.0
      - name: Verify chronology guards
        run: python scripts/v016_r3_test.py
      - name: Build 2023 Q4 pre-race sidecar
        run: |
          mkdir -p cache
          python -u scripts/v016_r3_pre2024.py \
            --workers 16 \
            --output cache/pre2024_q4_2023.npz
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '35875673825'
          name: v016-r2-features-2024
          path: features
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '35875673825'
          name: v016-r2-result-place-small-2024
          path: baseline
      - name: Evaluate preregistered place-small on 2024 Q1
        run: |
          python -u scripts/v016_r3_q1.py \
            --prior-cache cache/pre2024_q4_2023.npz \
            --current-cache features/features_2024.npz \
            --baseline-dir baseline \
            --output-dir q1-result
      - name: Complete 2024 annual gate without changing policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q1=json.load(open('q1-result/result.json'))
          partial=json.load(open('data/v016_r3_partial_result.json'))
          rest=partial['families']['place']['q2ToQ4']
          a=q1['total']
          stake=int(a['stake'])+int(rest['stake'])
          payout=int(a['payout'])+int(rest['payout'])
          purchases=int(a['purchaseRaces'])+int(rest['purchaseRaces'])
          hits=int(a['hits'])+int(rest['hits'])
          largest=max(int(a.get('largestHitPayout',0)),int(rest.get('largestHitPayout',0)))
          annual={
            'purchaseRaces':purchases,'hits':hits,'stake':stake,'payout':payout,
            'profit':payout-stake,'roi':100*payout/stake if stake else 0.0,
            'largestHitPayout':largest,
            'largestHitShare':100*largest/payout if payout else 0.0,
            'roiWithoutLargestHit':100*(payout-largest)/stake if stake else 0.0,
          }
          gates=json.load(open('data/v016_r3_protocol.json'))['inherits']['annual_gate']
          q1m=q1['predictionMetrics']
          q1_calibration=(q1m['deltaVsStatic']<0 and q1m['deltaVsMarket']<0)
          passed=(annual['roi']>=gates['roi_min_percent'] and
                  annual['purchaseRaces']>=gates['purchase_races_min'] and
                  annual['hits']>=gates['hits_min'] and
                  annual['largestHitShare']<=gates['largest_hit_share_max_percent'] and
                  annual['roiWithoutLargestHit']>=gates['roi_without_largest_hit_min_percent'])
          out={
            'protocol':'v016-core-r3-walk-forward-v1','family':'place-small','year':2024,
            'q1':q1,'q2ToQ4':rest,'annual':annual,'annualGate':gates,
            'q1CalibrationGate':q1_calibration,'annualPass':passed,
            'releaseQualified':False,'finalHoldoutOpened':False,
            'decision':'freeze_candidate_for_next_preholdout_check' if passed and q1_calibration else 'reject_r3_place_small',
            'notes':['Betting policy remained fixed from r2','2025-10-01..2025-12-31 was not read']
          }
          Path('data/v016_r3_annual2024.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          Path('data/v016_r3_q1_result.json').write_text(json.dumps(q1,ensure_ascii=False,indent=2)+'\n')
          md=[
            '# v0.16 CORE r3 2024 annual result','',
            f"Q1 ROI: {a['roi']:.2f}% / purchases {a['purchaseRaces']} / hits {a['hits']}",
            f"Q1 calibration gate: {'PASS' if q1_calibration else 'FAIL'}",'',
            f"Annual ROI: {annual['roi']:.2f}%",
            f"Annual purchases: {annual['purchaseRaces']}",
            f"Annual hits: {annual['hits']}",
            f"Largest-hit share: {annual['largestHitShare']:.2f}%",
            f"ROI without largest hit: {annual['roiWithoutLargestHit']:.2f}%",'',
            f"Annual gate: {'PASS' if passed else 'FAIL'}",
            f"Decision: {out['decision']}",'',
            'Final 2025 Q4 holdout remains sealed.'
          ]
          Path('data/v016_r3_annual2024.md').write_text('\n'.join(md)+'\n')
          print(json.dumps({'annual':annual,'q1CalibrationGate':q1_calibration,'annualPass':passed,'decision':out['decision']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v016-r3-q1-pre2024-sidecar
          path: |
            cache/pre2024_q4_2023.npz
            cache/pre2024_q4_2023.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v016-r3-q1-result
          path: |
            q1-result/
            data/v016_r3_q1_result.json
            data/v016_r3_annual2024.json
            data/v016_r3_annual2024.md
          retention-days: 90
      - name: Save research-only Q1 and annual result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v016_r3_q1_result.json data/v016_r3_annual2024.json data/v016_r3_annual2024.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record v016 r3 Q1 and annual 2024 result [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
