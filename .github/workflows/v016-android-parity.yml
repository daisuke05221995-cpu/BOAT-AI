name: v0.16 Android Model A parity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/java/jp/boatai/app/LightGbmTextModel.kt'
      - 'app/src/main/java/jp/boatai/app/ModelAConditionalPredictor.kt'
      - 'app/src/main/java/jp/boatai/app/ModelAPlayerHistory.kt'
      - 'app/src/test/java/jp/boatai/app/ModelARealParityTest.kt'
      - 'app/src/test/java/jp/boatai/app/ModelAChainRealParityTest.kt'
      - 'app/src/test/java/jp/boatai/app/ModelAConditionalPredictorTest.kt'
      - 'app/src/test/java/jp/boatai/app/ModelAPlayerHistoryParityTest.kt'
      - 'scripts/v016_android_parity_fixture.py'
      - 'scripts/v016_android_chain_fixture.py'
      - 'scripts/v016_android_history_fixture.py'
      - '.github/workflows/v016-android-parity.yml'

permissions:
  contents: read
  actions: read

jobs:
  raw-score-chain-history-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned parity dependencies
        run: python -m pip install --disable-pip-version-check 'lightgbm==4.6.0' 'numpy==2.3.5'

      - name: Download frozen Model A artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/model-a /tmp/model-a.zip
          mkdir -p /tmp/model-a
          gh api repos/${{ github.repository }}/actions/artifacts/10784912368/zip > /tmp/model-a.zip
          echo '58b845fa8d07efe258b08a23ac6caafab2e4854ce4b84618fb4af6ae3f3687fe  /tmp/model-a.zip' | sha256sum -c -
          unzip -q /tmp/model-a.zip -d /tmp/model-a
          test -f /tmp/model-a/manifest.json
          test -f /tmp/model-a/stage0.txt
          test -f /tmp/model-a/stage1.txt
          test -f /tmp/model-a/stage2.txt

      - name: Download frozen Jul-Aug pre-race feature artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/model-a-features /tmp/model-a-features.zip
          mkdir -p /tmp/model-a-features
          gh api repos/${{ github.repository }}/actions/artifacts/10784104679/zip > /tmp/model-a-features.zip
          echo 'c862a002ab061c7c8e711d5a330bf0d36b02a8486bc60cd1c0be671ff604ce1c  /tmp/model-a-features.zip' | sha256sum -c -
          unzip -q /tmp/model-a-features.zip -d /tmp/model-a-features
          test -f /tmp/model-a-features/development.npz

      - name: Generate 3,072 raw-score fixture rows
        run: |
          rm -rf /tmp/model-a-parity
          python scripts/v016_android_parity_fixture.py \
            --model-dir /tmp/model-a \
            --output-dir /tmp/model-a-parity \
            --rows 1024
          cat /tmp/model-a-parity/summary.json

      - name: Generate 64 actual pre-race 120-way fixtures
        run: |
          python scripts/v016_android_chain_fixture.py \
            --feature-cache /tmp/model-a-features/development.npz \
            --model-dir /tmp/model-a \
            --output /tmp/model-a-parity/chain.csv \
            --races 64
          cat /tmp/model-a-parity/chain.json

      - name: Generate synthetic Python player-history fixture
        run: python scripts/v016_android_history_fixture.py --output /tmp/model-a-parity/history.txt

      - name: Compare Kotlin raw scores against LightGBM 4.6.0
        env:
          BOAT_AI_PARITY_DIR: /tmp/model-a-parity
        run: ./gradlew testDebugUnitTest --tests jp.boatai.app.ModelARealParityTest --stacktrace

      - name: Compare Kotlin 120-way probabilities against frozen Python Model A
        env:
          BOAT_AI_PARITY_DIR: /tmp/model-a-parity
        run: ./gradlew testDebugUnitTest --tests jp.boatai.app.ModelAChainRealParityTest --stacktrace

      - name: Compare Kotlin player history against frozen Python implementation
        env:
          BOAT_AI_PARITY_DIR: /tmp/model-a-parity
        run: ./gradlew testDebugUnitTest --tests jp.boatai.app.ModelAPlayerHistoryParityTest --stacktrace

      - name: Upload parity summaries
        uses: actions/upload-artifact@v4
        with:
          name: v016-android-model-a-parity
          path: |
            /tmp/model-a-parity/summary.json
            /tmp/model-a-parity/chain.json
          if-no-files-found: error
