name: Build and verify BOAT AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Verify live race API schema
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          JST = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(JST).date()
          last_error = None
          for days_back in range(4):
              d = today - datetime.timedelta(days=days_back)
              url = f"https://boatraceopenapi.github.io/api/v1/{d.year}/{d:%Y%m%d}.json"
              req = urllib.request.Request(url, headers={"User-Agent":"BOAT-AI-CI/0.3.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.load(r)
                  stadiums = data.get("programs",{}).get("stadiums",{})
                  if not stadiums:
                      raise RuntimeError("No stadium data")
                  race_count = sum(len(v.get("races",{})) for v in stadiums.values())
                  if race_count <= 0:
                      raise RuntimeError("No races")
                  sample = next(iter(next(iter(stadiums.values()))["races"].values()))
                  assert "racers" in sample and "closed_at" in sample
                  print(f"API OK: date={d}, stadiums={len(stadiums)}, races={race_count}")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"API unavailable for {d}: {exc}")
          else:
              raise RuntimeError(f"No usable BOAT RACE API data in last 4 days: {last_error}")
          PY

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOAT-AI-v0.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
