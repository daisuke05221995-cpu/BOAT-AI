name: Apply live odds audit persistence patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-odds-audit-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/live_odds_audit_patch.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/boatai/app/Models.kt app/src/main/java/jp/boatai/app/LiveOddsAuditRegistry.kt app/src/main/java/jp/boatai/app/BoatRaceRepository.kt app/src/main/java/jp/boatai/app/PredictionHistoryStore.kt app/src/main/java/jp/boatai/app/PredictionTrackingScheduler.kt app/src/test/java/jp/boatai/app/PredictionRecordTest.kt
          git diff --cached --check
          git commit -m "Persist live odds audit snapshots [live-odds-audit]"
          git push origin HEAD:main
