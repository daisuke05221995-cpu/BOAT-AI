          one(vm,
              '    fun previousDay() = loadDate(_ui.value.date.minusDays(1))\n    fun nextDay() = loadDate(_ui.value.date.plusDays(1))\n    fun refresh() = loadDate(_ui.value.date)',
              '    fun previousDay() {\n        val target = _ui.value.date.minusDays(1)\n        if (!target.isBefore(earliestBrowsableDate())) loadDate(target)\n    }\n    fun nextDay() {\n        val target = _ui.value.date.plusDays(1)\n        if (!target.isAfter(currentToday())) loadDate(target)\n    }\n    fun refresh() {\n        loadModelARecentVirtual()\n        loadDate(_ui.value.date)\n    }')
