name: Integrate recent Model A virtual history v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v0161-integrate-recent-virtual-v2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Android state and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count={s.count(old)} for {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          vm='app/src/main/java/jp/boatai/app/BoatViewModel.kt'
          one(vm,
              '    val predictionHistory: List<PredictionRecord> = emptyList(),\n    val performance: PredictionPerformanceProfile = PredictionPerformanceProfile(),',
