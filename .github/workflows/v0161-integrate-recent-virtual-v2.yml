          PY
      - name: Commit Android integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/boatai/app/BoatViewModel.kt app/src/main/java/jp/boatai/app/CompactDashboardScreens.kt app/src/main/java/jp/boatai/app/MainActivity.kt
