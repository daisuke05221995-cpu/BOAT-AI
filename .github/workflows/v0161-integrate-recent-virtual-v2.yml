              '                        oddsDecision = if (PredictionEngine.hasValueStrategyModel() || PredictionEngine.hasAiForecastMode()) {\n                            decision.reason',
              '                        oddsDecision = if (retrospective != null) {\n                            "過去Model A再現。予想は対象日前日までの履歴のみ、表示オッズはレース終了後に取得した公式値"\n                        } else if (PredictionEngine.hasValueStrategyModel() || PredictionEngine.hasAiForecastMode()) {\n                            decision.reason')

          dash='app/src/main/java/jp/boatai/app/CompactDashboardScreens.kt'
