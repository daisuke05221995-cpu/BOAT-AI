name: Apply compact app UI refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app-ui-refresh.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact UI patch
        run: python3 scripts/app_ui_refresh.py

      - name: Commit UI patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/boatai/app/MainActivity.kt app/src/main/java/jp/boatai/app/BoatViewModel.kt
          git commit -m "Refresh app UI with purchase tab and compact dashboards [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
