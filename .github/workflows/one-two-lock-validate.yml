name: One-two lock integrate and validate

on:
  push:
    branches:
      - feature/one-two-lock

permissions:
  contents: write

jobs:
  integrate-one-two-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/one-two-lock
          fetch-depth: 0

      - name: Integrate feature idempotently
        run: python3 scripts/integrate_one_two_lock_v2.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Commit integrated sources when changed
        run: |
          if git diff --quiet; then
            echo 'No integration changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/jp/boatai/app/BoatViewModel.kt \
            app/src/main/java/jp/boatai/app/MainActivity.kt \
            app/src/main/java/jp/boatai/app/PredictionTrackingScheduler.kt \
            app/build.gradle.kts
          git commit -m 'Wire 1-2 lock mode into app and tracker'
          git push origin HEAD:feature/one-two-lock
