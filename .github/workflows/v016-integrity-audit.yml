name: v016 historical odds integrity and forecast readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/v016_integrity_*.py
      - data/v016_integrity_protocol.json
      - .github/workflows/v016-integrity-audit.yml
permissions:
  actions: read
  contents: read
concurrency:
  group: v016-integrity-audit
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '2'
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - run: python scripts/v016_integrity_test.py
      - name: Mutation boundary
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          w=Path('.github/workflows/v016-integrity-audit.yml').read_text()
          staged=re.findall(r'^          git add (.*)$',w,flags=re.M)
          assert staged==['data/v016_integrity_result.json data/v016_integrity_report.md data/v016_forecast_candidate.json data/v016_forecast_deployability.md']
          assert "month: [7, 8]" in w
          PY

  month:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        month: [7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '35940833546'
          name: v016-r4-raw-2025
          path: raw
      - run: python -u scripts/v016_integrity_audit.py odds-month --month '${{ matrix.month }}' --raw raw/raw_2025.npz --metadata raw/raw_2025.json --output 'audit/odds-${{ matrix.month }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: v016-integrity-month-${{ matrix.month }}
          path: audit/
          retention-days: 90

  provenance:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '35940833546'
          name: v016-r4-metadata-raw-2025
          path: metadata
      - run: python -u scripts/v016_integrity_audit.py provenance --metadata metadata/raw_2025.json --output audit/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: v016-integrity-provenance
          path: audit/
          retention-days: 90

  forecast:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '35940833546'
          name: v016-r4-raw-2025
          path: raw
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '35940833546'
          name: v016-r4-features
          path: features
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '35940833546'
          name: v016-r4-model-reaction
          path: model
      - run: |
          python -u scripts/v016_integrity_audit.py forecast --raw raw/raw_2025.npz \
            --model model --features features --output forecast \
            --model-artifact-digest sha256:58b845fa8d07efe258b08a23ac6caafab2e4854ce4b84618fb4af6ae3f3687fe
      - uses: actions/upload-artifact@v4
        with:
          name: v016-integrity-forecast-audit
          path: |
            forecast/forecast_candidate.json
            forecast/deployability.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v016-integrity-forecast-assets
          path: forecast/bundle/
          retention-days: 90

  publish:
    needs: [month, provenance, forecast]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          pattern: v016-integrity-month-*
          path: audit
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: v016-integrity-provenance
          path: audit
      - uses: actions/download-artifact@v4
        with:
          name: v016-integrity-forecast-audit
          path: audit
      - run: python scripts/v016_integrity_audit.py publish --input audit --output data --run '${{ github.run_id }}'
      - uses: actions/upload-artifact@v4
        with:
          name: v016-integrity-final
          path: |
            data/v016_integrity_result.json
            data/v016_integrity_report.md
            data/v016_forecast_candidate.json
            data/v016_forecast_deployability.md
          retention-days: 90
      - name: Save research outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v016_integrity_result.json data/v016_integrity_report.md data/v016_forecast_candidate.json data/v016_forecast_deployability.md
          git commit -m 'Record v016 integrity audit and forecast candidate [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
