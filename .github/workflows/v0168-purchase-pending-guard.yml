name: v0.16.8 purchase pending guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v0168-purchase-pending-guard.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Patch pending purchase safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          vm_path = Path('app/src/main/java/jp/boatai/app/BoatViewModel.kt')
          vm = vm_path.read_text()
          function_marker = '    private fun savePendingPurchase('
          guard_marker = '未確定の投票待ちがあります。先に実購入として確定するか、購入しなかった場合は破棄してください'
          if vm.count(function_marker) != 1:
              raise SystemExit(f'BoatViewModel function marker mismatch: {vm.count(function_marker)}')
          if guard_marker not in vm:
              function_start = vm.index(function_marker)
              body_marker = '    ): Boolean {'
              body_pos = vm.index(body_marker, function_start) + len(body_marker)
              guard = '''
              val existing = _ui.value.pendingPurchase ?: pendingPurchaseStore.load()
              if (existing != null) {
                  _ui.update {
                      it.copy(
                          pendingPurchase = existing,
                          actionMessage = "未確定の投票待ちがあります。先に実購入として確定するか、購入しなかった場合は破棄してください"
                      )
                  }
                  return false
              }
          '''
              vm = vm[:body_pos] + guard + vm[body_pos:]
              vm_path.write_text(vm)

          ui_path = Path('app/src/main/java/jp/boatai/app/MainActivity.kt')
          ui = ui_path.read_text()
          diagnostics_marker = '        item { DataDiagnosticsCard(ui.diagnostics, onRetry = vm::refresh) }\n'
          pending_marker = '        ui.pendingPurchase?.let { pending ->\n            item { PendingPurchaseCard(pending, vm) }\n        }\n'
          if ui.count(diagnostics_marker) != 1:
              raise SystemExit(f'MainActivity diagnostics marker mismatch: {ui.count(diagnostics_marker)}')
          if pending_marker not in ui:
              pos = ui.index(diagnostics_marker) + len(diagnostics_marker)
              ui = ui[:pos] + pending_marker + ui[pos:]
              ui_path.write_text(ui)
          PY

      - name: Verify patch
        run: |
          grep -n "未確定の投票待ちがあります" app/src/main/java/jp/boatai/app/BoatViewModel.kt
          grep -n "ui.pendingPurchase?.let" app/src/main/java/jp/boatai/app/MainActivity.kt

      - name: Test lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit safety patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/boatai/app/BoatViewModel.kt app/src/main/java/jp/boatai/app/MainActivity.kt
          git commit -m "Prevent pending purchase overwrite [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
