name: v0.16.8 purchase pending guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v0168-purchase-pending-guard.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Patch pending purchase safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          vm_path = Path('app/src/main/java/jp/boatai/app/BoatViewModel.kt')
          vm = vm_path.read_text()
          vm_anchor = '''    private fun savePendingPurchase(
              entries: List<Pair<RaceData, List<PredictionPick>>>,
              message: String
          ): Boolean {
          '''
          vm_insert = vm_anchor + '''        val existing = _ui.value.pendingPurchase ?: pendingPurchaseStore.load()
              if (existing != null) {
                  _ui.update {
                      it.copy(
                          pendingPurchase = existing,
                          actionMessage = "未確定の投票待ちがあります。先に実購入として確定するか、購入しなかった場合は破棄してください"
                      )
                  }
                  return false
              }
          '''
          if vm.count(vm_anchor) != 1:
              raise SystemExit(f'BoatViewModel savePendingPurchase anchor mismatch: {vm.count(vm_anchor)}')
          vm_path.write_text(vm.replace(vm_anchor, vm_insert, 1))

          ui_path = Path('app/src/main/java/jp/boatai/app/MainActivity.kt')
          ui = ui_path.read_text()
          ui_anchor = '''        item { DataDiagnosticsCard(ui.diagnostics, onRetry = vm::refresh) }
              item { PredictionModeBar(sortMode) { sortMode = it } }
          '''
          ui_insert = '''        item { DataDiagnosticsCard(ui.diagnostics, onRetry = vm::refresh) }
              ui.pendingPurchase?.let { pending ->
                  item { PendingPurchaseCard(pending, vm) }
              }
              item { PredictionModeBar(sortMode) { sortMode = it } }
          '''
          if ui.count(ui_anchor) != 1:
              # Normalize against the real Kotlin indentation if YAML block indentation was stripped.
              ui_anchor = '        item { DataDiagnosticsCard(ui.diagnostics, onRetry = vm::refresh) }\n        item { PredictionModeBar(sortMode) { sortMode = it } }\n'
              ui_insert = '        item { DataDiagnosticsCard(ui.diagnostics, onRetry = vm::refresh) }\n        ui.pendingPurchase?.let { pending ->\n            item { PendingPurchaseCard(pending, vm) }\n        }\n        item { PredictionModeBar(sortMode) { sortMode = it } }\n'
          if ui.count(ui_anchor) != 1:
              raise SystemExit(f'MainActivity PredictionScreen anchor mismatch: {ui.count(ui_anchor)}')
          ui_path.write_text(ui.replace(ui_anchor, ui_insert, 1))
          PY

      - name: Verify patch
        run: |
          grep -n "未確定の投票待ちがあります" app/src/main/java/jp/boatai/app/BoatViewModel.kt
          grep -n "PendingPurchaseCard(pending, vm)" app/src/main/java/jp/boatai/app/MainActivity.kt

      - name: Test lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit safety patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/boatai/app/BoatViewModel.kt app/src/main/java/jp/boatai/app/MainActivity.kt
          git commit -m "Prevent pending purchase overwrite [skip ci]"
          git push origin HEAD:main
