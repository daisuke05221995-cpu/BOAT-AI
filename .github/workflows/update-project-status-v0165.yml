name: Update project status v0.16.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-project-status-v0165.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update project status
        run: python3 scripts/update_project_status_v0165.py

      - name: Commit project status and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git rm -f .github/workflows/update-project-status-v0165.yml scripts/update_project_status_v0165.py
          git diff --cached --check
          git commit -m "Update PROJECT_STATUS for v0.16.5"
          git push origin HEAD:main
