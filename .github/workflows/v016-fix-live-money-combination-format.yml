name: v0.16 live money Android combination format fix

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/v016_fix_live_money_combination_format.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Android combination format patch
        run: python scripts/v016_fix_live_money_combination_format.py

      - name: Validate live money evaluator
        run: |
          python scripts/v016_live_money_eval_test.py -q
          python -m json.tool data/v016_live_money_protocol.json >/dev/null

      - name: Commit validated research fix
        run: |
          if git diff --quiet; then
            echo 'No research changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v016_live_money_eval.py scripts/v016_live_money_eval_test.py data/v016_live_money_protocol.json data/v016_live_money_research_report.md
          git commit -m 'Align live money evaluator with Android combination format'
          git push
