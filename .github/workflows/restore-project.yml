name: Restore BOAT AI v0.3 project

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-project.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore recovered application source to repository root
        shell: bash
        run: |
          set -euo pipefail
          test -d recovered-v0.3.0
          cp -a recovered-v0.3.0/. .

      - name: Recreate root Gradle project files
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BOAT-AI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.8.2" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > .gitignore <<'EOF'
          *.iml
          .gradle/
          local.properties
          .idea/
          .DS_Store
          build/
          */build/
          captures/
          .externalNativeBuild/
          .cxx/
          *.jks
          *.keystore
          *.p12
          EOF

      - name: Sanity check restored project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/jp/boatai/app/MainActivity.kt
          test -f .github/workflows/build-apk.yml
          test -f .github/workflows/release.yml
          echo "Restored source files: $(find app -type f | wc -l)"

      - name: Commit restored project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app .github/workflows/build-apk.yml .github/workflows/release.yml settings.gradle.kts build.gradle.kts gradle.properties .gitignore
          git commit -m 'Restore BOAT AI v0.3 Android project' || exit 0
          git push
