name: Publish BOAT AI v0.3.0 now

on:
  push:
    paths:
      - '.github/workflows/release-now.yml'

permissions:
  contents: write

jobs:
  release-now:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$APP_VERSION"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          BOAT_AI_KEYSTORE_BASE64: ${{ secrets.BOAT_AI_KEYSTORE_BASE64 }}
          BOAT_AI_SIGNING_PASSWORD: ${{ secrets.BOAT_AI_SIGNING_PASSWORD }}
        run: |
          test -n "$BOAT_AI_KEYSTORE_BASE64"
          test -n "$BOAT_AI_SIGNING_PASSWORD"

      - name: Restore release signing key
        env:
          BOAT_AI_KEYSTORE_BASE64: ${{ secrets.BOAT_AI_KEYSTORE_BASE64 }}
          BOAT_AI_SIGNING_PASSWORD: ${{ secrets.BOAT_AI_SIGNING_PASSWORD }}
        run: |
          echo "$BOAT_AI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boat-ai-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/boat-ai-release.p12" -storepass "$BOAT_AI_SIGNING_PASSWORD" -alias boatai >/dev/null

      - name: Test, lint and build signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/boat-ai-release.p12
          BOAT_AI_SIGNING_PASSWORD: ${{ secrets.BOAT_AI_SIGNING_PASSWORD }}
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          APK="BOAT-AI-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --title "BOAT AI $TAG" --generate-notes --target main
          fi
