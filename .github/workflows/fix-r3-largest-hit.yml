name: Fix r3 largest-hit accounting

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_r3_largest_hit.py'
      - '.github/workflows/fix-r3-largest-hit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fix_r3_largest_hit.py
      - name: Commit fix and remove temporary patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v016_r3_walkforward.py
          git rm scripts/fix_r3_largest_hit.py .github/workflows/fix-r3-largest-hit.yml
          git commit -m 'Fix r3 largest-hit accounting'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
