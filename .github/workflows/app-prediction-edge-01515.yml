name: Apply v0.15.15 prediction edge correction

on:
  push:
    branches: [main]
    paths:
      - 'scripts/app_prediction_edge_patch_01515.py'
      - '.github/workflows/app-prediction-edge-01515.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-prediction-edge-01515
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Apply prediction edge patch
        run: python3 scripts/app_prediction_edge_patch_01515.py

      - name: Verify anti-market-following guards
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'MODEL_WEIGHT = 0.80' app/src/main/java/jp/boatai/app/AverageRoiReferenceStrategy.kt
          grep -n 'MIN_MARKET_EDGE_RATIO = 1.08' app/src/main/java/jp/boatai/app/AverageRoiReferenceStrategy.kt
          grep -n 'MAX_FIRST_FORM_RANK = 2' app/src/main/java/jp/boatai/app/AverageRoiReferenceStrategy.kt
          grep -n 'HISTORICAL_ROI_APPLIES_TO_CURRENT = false' app/src/main/java/jp/boatai/app/AverageRoiReferenceStrategy.kt
          ! grep -n 'const val ALPHA = 0.25' app/src/main/java/jp/boatai/app/AverageRoiReferenceStrategy.kt

      - name: Unit test, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit verified app and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/app_prediction_edge_patch_01515.py .github/workflows/app-prediction-edge-01515.yml
          git add app
          git commit -m 'Release v0.15.15 AI-first prediction edge correction'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
