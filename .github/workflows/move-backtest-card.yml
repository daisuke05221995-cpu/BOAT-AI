name: Move historical backtest to top

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/jp/boatai/app/MainActivity.kt')
          text=p.read_text(encoding='utf-8')
          card='        item { HistoricalBacktestCard() }\n\n'
          if card not in text:
              raise SystemExit('HistoricalBacktestCard marker missing')
          text=text.replace(card, '', 1)
          marker='    ) {\n        item { SummaryCard("購入推奨だけ買った場合（全期間）"'
          if marker not in text:
              raise SystemExit('ProfitScreen first item marker missing')
          text=text.replace(marker, '    ) {\n        item { HistoricalBacktestCard() }\n\n        item { SummaryCard("購入推奨だけ買った場合（全期間）"', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/jp/boatai/app/MainActivity.kt
          git commit -m 'Prioritize 2026 backtest in profit screen'
          git pull --rebase origin main
          git push origin HEAD:main
