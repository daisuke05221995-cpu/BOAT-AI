name: Release signed BOAT AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$APP_VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
              echo "Tag version $TAG_VERSION does not match app version $APP_VERSION" >&2
              exit 1
            fi
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          BOAT_AI_KEYSTORE_BASE64: ${{ secrets.BOAT_AI_KEYSTORE_BASE64 }}
          BOAT_AI_SIGNING_PASSWORD: ${{ secrets.BOAT_AI_SIGNING_PASSWORD }}
        run: |
          test -n "$BOAT_AI_KEYSTORE_BASE64"
          test -n "$BOAT_AI_SIGNING_PASSWORD"

      - name: Restore release signing key
        env:
          BOAT_AI_KEYSTORE_BASE64: ${{ secrets.BOAT_AI_KEYSTORE_BASE64 }}
        run: |
          echo "$BOAT_AI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boat-ai-release.p12"
          keytool -list \
            -keystore "$RUNNER_TEMP/boat-ai-release.p12" \
            -storepass "${{ secrets.BOAT_AI_SIGNING_PASSWORD }}" \
            -alias boatai >/dev/null

      - name: Test, lint and build signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/boat-ai-release.p12
          BOAT_AI_SIGNING_PASSWORD: ${{ secrets.BOAT_AI_SIGNING_PASSWORD }}
        run: |
          ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release APK
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT="BOAT-AI-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.apk.outputs.path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "BOAT AI $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
