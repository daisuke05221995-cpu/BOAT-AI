name: Cleanup temporary recovery files

on:
  push:
    paths:
      - '.github/workflows/cleanup-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove recovery directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-v0.3.0 recovered-v0.3.0

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A source-v0.3.0 recovered-v0.3.0
          git commit -m 'Remove temporary recovery files' || exit 0
          git push
