name: Apply Android UX fixes

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/app_ux_fix.py'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UX patch
        run: python3 scripts/app_ux_fix.py

      - name: Commit application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/boatai/app
          if git diff --cached --quiet; then
            echo "No application changes"
            exit 0
          fi
          git commit -m "Fix settings navigation back behavior and silent notifications"
          git pull --rebase origin main
          git push origin HEAD:main
