name: Refresh 2026 historical backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/build_2026_backtest.py'
      - 'scripts/tune_2026_policy.py'
      - 'scripts/backfill_historical.py'
      - 'scripts/merge_historical.py'
      - '.github/workflows/historical-backtest.yml'

permissions:
  contents: write

concurrency:
  group: historical-backtest-2026
  cancel-in-progress: true

jobs:
  check-prebase:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check verified pre-2026 snapshot
        id: check
        run: |
          python - <<'PY'
          import json, os
          path='data/historical_learning_pre2026.json'
          verified=False
          if os.path.exists(path):
              try:
                  data=json.load(open(path, encoding='utf-8'))
                  expected_venues={str(i) for i in range(1,25)}-{'23'}
                  expected_keys={f'{v}-{lane}' for v in expected_venues for lane in range(1,7)}
                  verified=(
                      data.get('trainedFrom') == '2021-09-22'
                      and data.get('trainedThrough') == '2025-12-31'
                      and data.get('snapshotComplete') is True
                      and int(data.get('historicalRaceCount', 0)) > 200000
                      and set(data.get('venueRaceCounts', {})) == expected_venues
                      and set(data.get('starts', {})) == expected_keys
                  )
              except Exception:
                  verified=False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"exists={'true' if verified else 'false'}\n")
          print(f"verified pre-2026 snapshot: {verified}")
          PY

  build-prebase:
    needs: check-prebase
    if: needs.check-prebase.outputs.exists != 'true'
    name: Pre-2026 ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: '2021'
            start: '2021-09-22'
            end: '2021-12-31'
          - id: '2022'
            start: '2022-01-01'
            end: '2022-12-31'
          - id: '2023'
            start: '2023-01-01'
            end: '2023-12-31'
          - id: '2024'
            start: '2024-01-01'
            end: '2024-12-31'
          - id: '2025'
            start: '2025-01-01'
            end: '2025-12-31'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official K-file tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python -m pip install --upgrade pip
          pip install 'boatrace-lzh==0.1.0'

      - name: Build yearly learning partial
        run: |
          python -u scripts/backfill_historical.py \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --workers 4 \
            --request-delay 0.25 \
            --allow-partial \
            --output 'partial/historical_learning_${{ matrix.id }}.json'

      - name: Validate yearly partial
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = next(Path('partial').glob('historical_learning_*.json'))
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['historicalRaceCount'] > 0
          assert len(data['starts']) > 0
          assert len(data['wins']) > 0
          print(data['trainedFrom'], data['trainedThrough'], data['historicalRaceCount'])
          PY

      - name: Upload yearly partial
        uses: actions/upload-artifact@v4
        with:
          name: pre2026-learning-${{ matrix.id }}
          path: partial/historical_learning_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 1

  refresh:
    needs: [check-prebase, build-prebase]
    if: always() && needs.check-prebase.result == 'success' && (needs.check-prebase.outputs.exists == 'true' || needs.build-prebase.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pre-2026 partials
        if: needs.check-prebase.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: pre2026-learning-*
          path: partial
          merge-multiple: true

      - name: Merge and verify pre-2026 learning snapshot
        if: needs.check-prebase.outputs.exists != 'true'
        run: |
          python -u scripts/merge_historical.py \
            --input-dir partial \
            --start 2021-09-22 \
            --end 2025-12-31 \
            --output data/historical_learning_pre2026.json
          python - <<'PY'
          import json
          path='data/historical_learning_pre2026.json'
          data=json.load(open(path, encoding='utf-8'))
          expected_venues={str(i) for i in range(1,25)}-{'23'}
          expected_keys={f'{v}-{lane}' for v in expected_venues for lane in range(1,7)}
          assert data['trainedFrom'] == '2021-09-22'
          assert data['trainedThrough'] == '2025-12-31'
          assert data['historicalRaceCount'] > 200000
          assert data['missingOrNoRaceDays'] == 0
          assert set(data['venueRaceCounts']) == expected_venues
          assert set(data['starts']) == expected_keys
          data['snapshotComplete'] = True
          data['knownSourceGap'] = 'Official K-file history has no venue 23 lane buckets; neutral priors are used until 2026 walk-forward observations.'
          with open(path, 'w', encoding='utf-8') as out:
              json.dump(data, out, ensure_ascii=False, separators=(',', ':'))
          print(f"Pre-2026 snapshot OK: {data['historicalRaceCount']:,} races / {len(expected_venues)} K-file venues / missing days 0")
          PY

      - name: Re-check leakage-safe pre-2026 snapshot
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/historical_learning_pre2026.json', encoding='utf-8'))
          expected_venues={str(i) for i in range(1,25)}-{'23'}
          expected_keys={f'{v}-{lane}' for v in expected_venues for lane in range(1,7)}
          assert data.get('snapshotComplete') is True
          assert data.get('trainedThrough') == '2025-12-31'
          assert int(data.get('historicalRaceCount', 0)) > 200000
          assert int(data.get('missingOrNoRaceDays', -1)) == 0
          assert set(data.get('venueRaceCounts', {})) == expected_venues
          assert set(data.get('starts', {})) == expected_keys
          PY

      - name: Build month and year backtest
        run: |
          python -u scripts/build_2026_backtest.py \
            --year 2026 \
            --start 2026-01-01 \
            --learning data/historical_learning_pre2026.json \
            --workers 16 \
            --output data/historical_backtest_2026.json

      - name: Validate generated backtest
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/historical_backtest_2026.json', encoding='utf-8'))
          assert data['year'] == 2026
          assert data['dataFrom'] == '2026-01-01'
          assert not data['failedDays'], data['failedDays']
          assert data['yearSummary']['totalSettledRaces'] > 1000
          assert data['yearSummary']['evaluatedRaces'] > 1000
          assert len(data['months']) >= 1
          assert data['yearSummary']['purchaseRaces'] + data['yearSummary']['skippedRaces'] == data['yearSummary']['evaluatedRaces']
          print(json.dumps({
              'through': data['dataThrough'],
              'settled': data['yearSummary']['totalSettledRaces'],
              'evaluated': data['yearSummary']['evaluatedRaces'],
              'purchase': data['yearSummary']['purchaseRaces'],
              'skipped': data['yearSummary']['skippedRaces'],
              'hitRate': data['yearSummary']['hitRate'],
              'roi': data['yearSummary']['roi'],
              'profit': data['yearSummary']['profit'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Tune purchase policy on train and holdout periods
        run: |
          python -u scripts/tune_2026_policy.py \
            --learning data/historical_learning_pre2026.json \
            --workers 16 \
            --output data/policy_tuning_2026.json

      - name: Validate policy tuning output
        run: |
          python - <<'PY'
          import json
          data=json.load(open('data/policy_tuning_2026.json', encoding='utf-8'))
          assert data['candidateCount'] >= 300
          assert data['evaluatedRaces'] > 10000
          assert data['trainThrough'] == '2026-06-30'
          assert data['validationFrom'] == '2026-07-01'
          assert len(data['topRobust']) > 0
          print(json.dumps({
              'candidateCount': data['candidateCount'],
              'positiveRobustCount': data['positiveRobustCount'],
              'best': data['topRobust'][0],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/historical_learning_pre2026.json data/historical_backtest_2026.json data/policy_tuning_2026.json
          if git diff --cached --quiet; then
            echo 'Historical backtest is unchanged.'
          else
            git commit -m 'Refresh 2026 historical backtest data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
