name: Refresh 2026 historical backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/build_2026_backtest.py'
      - 'scripts/build_learning_contribution_from_json.py'
      - '.github/workflows/historical-backtest.yml'

permissions:
  contents: write

concurrency:
  group: historical-backtest-2026
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check verified pre-2026 learning snapshot
        id: prebase
        run: |
          python - <<'PY'
          import json, os
          path='data/historical_learning_pre2026.json'
          verified=False
          if os.path.exists(path):
              try:
                  data=json.load(open(path, encoding='utf-8'))
                  verified=(
                      data.get('trainedFrom') == '2021-09-22'
                      and data.get('trainedThrough') == '2025-12-31'
                      and data.get('snapshotComplete') is True
                      and int(data.get('historicalRaceCount', 0)) > 200000
                      and len(data.get('starts', {})) == 144
                  )
              except Exception:
                  verified=False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"exists={'true' if verified else 'false'}\n")
          print(f"verified pre-2026 snapshot: {verified}")
          PY

      - name: Build direct leakage-safe 2025-12-31 learning snapshot
        if: steps.prebase.outputs.exists != 'true'
        run: |
          python -u scripts/build_learning_contribution_from_json.py \
            --start 2021-09-22 \
            --end 2025-12-31 \
            --workers 16 \
            --output data/historical_learning_pre2026.json
          python - <<'PY'
          import json
          data=json.load(open('data/historical_learning_pre2026.json', encoding='utf-8'))
          assert data['trainedFrom'] == '2021-09-22'
          assert data['trainedThrough'] == '2025-12-31'
          assert data['snapshotComplete'] is True
          assert data['missingOrNoRaceDays'] == 0
          assert data['historicalRaceCount'] > 200000
          assert len(data['starts']) == 144
          assert len(data['venueRaceCounts']) == 24
          assert '23-1' in data['starts'] and '23-6' in data['starts']
          print(f"Pre-2026 snapshot OK: {data['historicalRaceCount']:,} races / 24 venues")
          PY

      - name: Build month and year backtest
        run: |
          python -u scripts/build_2026_backtest.py \
            --year 2026 \
            --start 2026-01-01 \
            --learning data/historical_learning_pre2026.json \
            --workers 16 \
            --output data/historical_backtest_2026.json

      - name: Validate generated backtest
        run: |
          python - <<'PY'
          import json
          pre=json.load(open('data/historical_learning_pre2026.json', encoding='utf-8'))
          assert pre.get('snapshotComplete') is True
          assert pre.get('trainedThrough') == '2025-12-31'
          assert len(pre.get('venueRaceCounts', {})) == 24
          data=json.load(open('data/historical_backtest_2026.json', encoding='utf-8'))
          assert data['year'] == 2026
          assert data['dataFrom'] == '2026-01-01'
          assert not data['failedDays'], data['failedDays']
          assert data['yearSummary']['totalSettledRaces'] > 1000
          assert data['yearSummary']['evaluatedRaces'] > 1000
          assert len(data['months']) >= 1
          assert data['yearSummary']['purchaseRaces'] + data['yearSummary']['skippedRaces'] == data['yearSummary']['evaluatedRaces']
          print(json.dumps({
              'through': data['dataThrough'],
              'settled': data['yearSummary']['totalSettledRaces'],
              'evaluated': data['yearSummary']['evaluatedRaces'],
              'purchase': data['yearSummary']['purchaseRaces'],
              'skipped': data['yearSummary']['skippedRaces'],
              'hitRate': data['yearSummary']['hitRate'],
              'roi': data['yearSummary']['roi'],
              'profit': data['yearSummary']['profit'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/historical_learning_pre2026.json data/historical_backtest_2026.json
          if git diff --cached --quiet; then
            echo 'Historical backtest is unchanged.'
          else
            git commit -m 'Refresh 2026 historical backtest data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
