name: Apply live audited profit UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-audited-profit-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI patch
        run: python3 scripts/live_audited_profit_ui_patch.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Verify live audited profit UI
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit UI and remove one-shot patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/boatai/app/CompactDashboardScreens.kt
          git rm -f .github/workflows/live-audited-profit-ui-patch.yml scripts/live_audited_profit_ui_patch.py
          git diff --cached --check
          git commit -m "Show audited live BUY performance separately"
          git push origin HEAD:main
